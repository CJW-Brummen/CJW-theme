name: Pull Request Quality

on:
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  COMPOSER_FLAGS: "--no-interaction --prefer-dist --no-progress"

jobs:
  php:
    name: PHP quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2, cs2pr
          extensions: mbstring, intl, mysqli, dom, json, libxml, curl, zip

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ runner.os }}-php-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: |
          composer validate --strict --no-check-lock
          composer install $COMPOSER_FLAGS

      - name: Lint PHP
        run: composer lint

      - name: WordPress coding standards
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpcs --standard=phpcs.xml.dist --extensions=php --report=checkstyle -q . | cs2pr

      - name: Formatting check
        run: composer format:check

      - name: PHPStan
        run: composer analyze:github

      - name: Security audit
        run: composer security

  frontend:
    name: Frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Check assets
        run: |
          npm ci
          npm run lint

  pr-review-gate:
    name: PR review gate
    runs-on: ubuntu-latest
    needs: [ php, frontend ]
    if: ${{ always() }}

    steps:
      - name: Check required jobs
        shell: bash
        run: |
          failed=0

          check_result() {
            local name="$1"
            local result="$2"

            echo "$name: $result"

            if [ "$result" != "success" ]; then
              failed=1
            fi
          }

          check_result "PHP quality" "${{ needs.php.result }}"
          check_result "Frontend assets" "${{ needs.frontend.result }}"

          exit "$failed"
