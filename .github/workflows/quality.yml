# Pull request quality gate.
#
# This file is shared verbatim by CJW-theme and CJW-plugin. Change one, change
# the other. Every check runs through a composer script, so `composer check`
# locally and this workflow always execute the same commands.

name: Pull Request Quality

on:
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  # dir-archiver 4 declares engines.node >= 24, and the release bundle is
  # built with it.
  NODE_VERSION: "24"
  COMPOSER_FLAGS: "--no-interaction --prefer-dist --no-progress"
  # Pinned to the wp-phpunit release the integration suite is written against.
  # Bump both together, or WP_UnitTestCase and WordPress disagree about what
  # exists.
  WP_VERSION: "7.1"

jobs:
  php:
    name: PHP quality
    runs-on: ubuntu-latest

    # The integration suite installs WordPress into this database and drops
    # every table it owns on each run. It is a throwaway container, which is
    # the only kind of database that configuration is safe against.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2, cs2pr
          extensions: mbstring, intl, mysqli, dom, json, libxml, curl, zip

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ runner.os }}-php-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: |
          composer validate --strict --no-check-lock
          composer install $COMPOSER_FLAGS

      # Runs before the linters: an advisory against a pinned tool is a fact
      # about the repository, not about the pull request under review, and
      # finding it first makes an unrelated red build immediately legible.
      - name: Security audit
        run: composer security

      - name: Lint PHP
        run: composer lint

      - name: WordPress coding standards
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpcs --standard=phpcs.xml.dist --extensions=php --report=checkstyle -q . | cs2pr

      - name: Formatting check
        run: composer format:check

      - name: PHPStan
        run: composer analyze:github

      - name: PHPUnit
        run: composer test

      # A real WordPress, not the stand-in in tests/bootstrap.php. Four bugs
      # have now reached main because a hand-written stub answered the way its
      # author expected rather than the way WordPress does.
      - name: Download WordPress
        shell: bash
        run: |
          curl -sSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wordpress.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C "$RUNNER_TEMP"

          # Mounted where WordPress expects it, so plugin_dir_url() and the
          # theme directory resolve the way they do on a real site.
          if [ -f style.css ] && [ -d sass ]; then
            ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/wordpress/wp-content/themes/cjw-theme"
          else
            ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/wordpress/wp-content/plugins/cjw"
          fi

      - name: Integration tests
        shell: bash
        env:
          WP_ROOT_DIR: ${{ runner.temp }}/wordpress
          WP_DB_HOST: 127.0.0.1:3306
          WP_DB_NAME: wordpress_test
          WP_DB_USER: root
          WP_DB_PASSWORD: root
        run: composer test:wp

  frontend:
    name: Frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mirrors the PHP job's audit-first order. Threshold is `high` on purpose:
      # everything in devDependencies is build tooling that never reaches a
      # browser, so a low or moderate advisory there is not worth a red build.
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint assets
        run: npm run lint

      # style.css, style-rtl.css and editor-style.css are build outputs that
      # are committed, and the linter only reads the Sass -- so one forgotten
      # `npm run compile` ships a stale stylesheet behind a green build.
      # Guarded by the file check rather than split into a theme-only workflow,
      # because this file is shared verbatim with the plugin, which has no Sass.
      - name: Committed CSS matches the Sass
        shell: bash
        run: |
          if [ ! -f sass/style.scss ]; then
            echo "No Sass in this repository - nothing to compare."
            exit 0
          fi

          npm run compile

          if ! git diff --exit-code -- style.css style-rtl.css editor-style.css; then
            echo "::error::The committed CSS does not match the Sass. Run 'npm run compile' and commit the result."
            exit 1
          fi

      # The .pot is a committed build output like the CSS above, and it rotted
      # the same way: it still carried strings from a file deleted long ago and
      # was missing two that had since been added. The theme advertises
      # translation-ready, and this is the artifact that claim rests on.
      - name: Committed .pot matches the source
        shell: bash
        run: |
          if [ ! -f languages/cjw-brummen.pot ]; then
            echo "No translation template in this repository - nothing to compare."
            exit 0
          fi

          composer make-pot

          # The header carries a generation date, which changes on every run and
          # says nothing about drift. Everything else must match.
          if ! git diff --exit-code --ignore-matching-lines='POT-Creation-Date' -- languages/cjw-brummen.pot; then
            echo "::error::The committed .pot does not match the source strings. Run 'composer make-pot' and commit the result."
            exit 1
          fi

  pr-review-gate:
    name: PR review gate
    runs-on: ubuntu-latest
    needs: [ php, frontend ]
    if: ${{ always() }}

    steps:
      - name: Check required jobs
        shell: bash
        run: |
          failed=0

          check_result() {
            local name="$1"
            local result="$2"

            echo "$name: $result"

            if [ "$result" != "success" ]; then
              failed=1
            fi
          }

          check_result "PHP quality" "${{ needs.php.result }}"
          check_result "Frontend assets" "${{ needs.frontend.result }}"

          exit "$failed"
