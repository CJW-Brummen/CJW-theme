# Pull request quality gate.
#
# This file is shared verbatim by CJW-theme and CJW-plugin. Change one, change
# the other. Every check runs through a composer script, so `composer check`
# locally and this workflow always execute the same commands.

name: Pull Request Quality

on:
  pull_request:
    branches: [ main ]
  merge_group:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  NODE_VERSION: "22"
  COMPOSER_FLAGS: "--no-interaction --prefer-dist --no-progress"

jobs:
  php:
    name: PHP quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2, cs2pr
          extensions: mbstring, intl, mysqli, dom, json, libxml, curl, zip

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: composer-${{ runner.os }}-php-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: |
          composer validate --strict --no-check-lock
          composer install $COMPOSER_FLAGS

      # Runs before the linters: an advisory against a pinned tool is a fact
      # about the repository, not about the pull request under review, and
      # finding it first makes an unrelated red build immediately legible.
      - name: Security audit
        run: composer security

      - name: Lint PHP
        run: composer lint

      - name: WordPress coding standards
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/phpcs --standard=phpcs.xml.dist --extensions=php --report=checkstyle -q . | cs2pr

      - name: Formatting check
        run: composer format:check

      - name: PHPStan
        run: composer analyze:github

      - name: PHPUnit
        run: composer test

  frontend:
    name: Frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint assets
        run: npm run lint

  pr-review-gate:
    name: PR review gate
    runs-on: ubuntu-latest
    needs: [ php, frontend ]
    if: ${{ always() }}

    steps:
      - name: Check required jobs
        shell: bash
        run: |
          failed=0

          check_result() {
            local name="$1"
            local result="$2"

            echo "$name: $result"

            if [ "$result" != "success" ]; then
              failed=1
            fi
          }

          check_result "PHP quality" "${{ needs.php.result }}"
          check_result "Frontend assets" "${{ needs.frontend.result }}"

          exit "$failed"
