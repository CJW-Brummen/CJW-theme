# Dependabot version updates.
#
# This file is shared verbatim by CJW-theme and CJW-plugin. Change one, change
# the other -- the two repositories are kept on the same toolchain on purpose.
#
# Grouping policy:
#   * minor + patch bumps are batched into one pull request per ecosystem per
#     week, because they are routine tooling churn and reviewing them one by one
#     produced a permanent backlog of near-identical pull requests;
#   * major bumps stay on their own pull request, because they need reading;
#   * security updates are never grouped, so a fix lands as its own small,
#     obvious pull request.
#
# One pin, explained where it is enforced below: PHPUnit is held at 12.
#
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "php"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    ignore:
      # PHPUnit stays on 12.
      #
      # The integration suite runs on WordPress's own test suite, which reaches
      # it through yoast/phpunit-polyfills. Those polyfills support PHPUnit
      # ^7.5 || ^8 || ^9 || ^11 || ^12 -- not 13, and not on their dev branch
      # either. A major bump here does not fail as a red build on the tooling:
      # it fails as WP_UnitTestCase refusing to load, which reads like the
      # WordPress install is broken.
      #
      # Revisit when the polyfills declare support for the next major. Until
      # then a bump is a decision, taken by hand, together with that check.
      - dependency-name: "phpunit/phpunit"
        update-types:
          - "version-update:semver-major"
    groups:
      php-tooling:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      js-tooling:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
